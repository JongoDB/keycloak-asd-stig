# Edge-verify override: an nginx proxy terminates TLS, verifies the card against the DoD anchors and forwards it in
# a header. ONLY for an image built with --build-arg X509_LOOKUP=nginx.
#   docker compose -f compose.yaml -f compose.edge.yaml up -d
# Keycloak believes that header, so it must be reachable from the proxy alone: its port is NOT published, and the
# only other container on its network is the proxy (Keycloak still needs egress for the DoD CRLs and OCSP, so the
# network is not `internal`). Do not attach anything else to kc-edge. The image refuses to start in header mode unless
# CAC_EDGE_TRUSTED_PROXY=true says so. Proxy files: keycloak-asd-stig/assets/deploy/proxy/ (nginx-edge-verify.conf,
# and anchors.pem = the DoD anchors, e.g. cat of /opt/keycloak-cac/pki/anchors/*.pem from the image).
services:
  keycloak:
    ports: !reset []
    networks: [kc-edge]
    env_file: [keycloak-cac.env, ../../../keycloak-asd-stig/assets/deploy/proxy/keycloak-edge-verify.env]
    environment:
      CAC_EDGE_TRUSTED_PROXY: "true"
  proxy:
    image: ${NGINX_IMAGE:-docker.io/library/nginx:1.27-alpine}   # pin by digest in production
    ports: ["${CAC_PORT:-443}:8443"]
    networks: [kc-edge]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    volumes:
      - ../../../keycloak-asd-stig/assets/deploy/proxy/nginx-edge-verify.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro          # tls.crt, tls.key, and ca.crt = the CA that issued Keycloak's internal certificate
      - ./edge-pki:/etc/nginx/pki:ro     # anchors.pem
    depends_on: [keycloak]
    restart: unless-stopped
networks:
  kc-edge: {}

# Edge-verify override: a proxy terminates TLS, verifies the card against the DoD anchors and forwards it in a
# header. ONLY for an image built with --build-arg X509_LOOKUP=nginx.
#   docker compose -f compose.yaml -f compose.edge.yaml up -d
# Keycloak believes that header, so two controls keep anyone but the proxy from setting it:
#   - mTLS: Keycloak's listener REQUIRES a TLS client certificate issued by edge-pki/proxy-ca.crt, which the proxy
#     presents (edge-pki/proxy-client.crt/.key). The image refuses to start in header mode without that CA.
#   - Keycloak's port is NOT published and the only other container on its network is the proxy (the network is
#     not `internal` because Keycloak needs egress for the DoD CRLs and OCSP). Attach nothing else to kc-edge.
# The proxy must be dedicated to Keycloak and must OVERWRITE the certificate header on every request
# (nginx-edge-mtls.conf does: proxy_set_header replaces any client-supplied copy).
#
# edge-pki/: anchors.pem (DoD anchors the proxy verifies cards against, e.g. the image's /opt/keycloak-cac/pki/anchors/*.pem),
#            proxy-ca.crt (the CA below), proxy-client.crt + proxy-client.key (issued by it, EKU clientAuth),
#            keycloak-ca.crt (the CA that issued Keycloak's server certificate, for proxy_ssl_verify).
services:
  keycloak:
    ports: !reset []
    networks: [kc-edge]
    env_file: [keycloak-cac.env, ../../../keycloak-asd-stig/assets/deploy/proxy/keycloak-edge-verify.env]
    environment:
      CAC_EDGE_PROXY_CA_FILE: /run/secrets/edge_proxy_ca
    secrets: [tls_crt, tls_key, db_password, bootstrap_admin_password, automation_secret, edge_proxy_ca]
  proxy:
    image: ${NGINX_IMAGE:-docker.io/library/nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10}
    ports: ["${CAC_PORT:-443}:8443"]
    networks: [kc-edge]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    volumes:
      - ./nginx-edge-mtls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro          # tls.crt + tls.key: the public server certificate
      - ./edge-pki:/etc/nginx/pki:ro
    depends_on: [keycloak]
    restart: unless-stopped
secrets:
  edge_proxy_ca: {file: ./edge-pki/proxy-ca.crt}
networks:
  kc-edge: {}

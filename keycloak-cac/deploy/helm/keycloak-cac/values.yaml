image:
  repository: registry.example.mil/iam/keycloak-cac
  tag: "26.8.2"
  pullPolicy: IfNotPresent
replicas: 2                      # nodes cluster through the database (jdbc-ping); every replica applies the realm idempotently

publicUrl: https://sso.example.mil   # what browsers and relying apps use (OIDC issuer = <publicUrl>/realms/<realm>)
realm: dod-cac
realmDisplayName: DoD CAC Login
usernameSource: upn              # upn | edipi | cn | subject-dn
crl:
  mode: online                   # online | file (air-gapped) | ocsp
  refreshSeconds: 21600
  # file mode: a volume your offline process keeps fresh (every CRL is signature-checked before use)
  volume: {}                     # e.g. {persistentVolumeClaim: {claimName: dod-crls}} or {configMap: {name: dod-crls}}
ocsp: null                       # null = default for the mode (on for online/ocsp, off for file)
admins: ""                       # Alt Token admins: "user=altUPN,user2=altUPN2"
users: ""                        # card holders: "user=<value of usernameSource>,..."
clients: {}                      # one entry per relying app: {payroll: {client_id: payroll, type: oidc-public, redirect_uris: [...]}}
extraAnchors: {}                 # extra CA certificates (PEM) to trust besides the baked DoD bundle: {name.pem: "-----BEGIN..."}
profileOverlay: {}               # any kcstig profile field, e.g. {sessions: {max_hours: 10}}

secrets:                         # existing Secrets (create them with your secret manager / sealed-secrets / ESO)
  tls: keycloak-cac-tls          # kubernetes.io/tls: tls.crt (chain) + tls.key for publicUrl's host
  db: keycloak-cac-db            # key: password
  bootstrap: keycloak-cac-bootstrap   # key: password (first start only)
  automation: keycloak-cac-automation # key: secret (>= 24 chars, keep stable)
db:
  url: jdbc:postgresql://postgres.iam.svc:5432/keycloak?sslmode=verify-full
  username: keycloak
bootstrapAdminUsername: bootstrap

# Edge mode: ONLY for an image built with X509_LOOKUP=nginx|haproxy|apache|envoy, where a proxy verifies the card and
# forwards it in a header that Keycloak then believes. Two controls, both required (the chart refuses to render
# without them):
#   - the proxy authenticates at the TLS layer: Keycloak's listener requires a client certificate issued by
#     proxyCA (Secret key, mounted alone, 0440) and trusts that CA for nothing else. proxyCA must be a DEDICATED CA
#     that issues the proxy's certificate and nothing else (anything it signs can speak for any card). Or set
#     proxyCert to pin the proxy's own certificate: then exactly that certificate is accepted;
#   - only the proxy can reach port 8443: every proxyFrom entry names BOTH a namespace and a pod by labels, the
#     NetworkPolicy is on and the Service is ClusterIP.
# Use a proxy DEDICATED to Keycloak that overwrites the certificate header on every request. A shared ingress
# controller is not acceptable: any tenant's Ingress could set that header (and its client certificate would be
# the one Keycloak trusts).
edge:
  enabled: false
  proxyCA: {secretName: "", key: ca.crt}   # dedicated CA that issued the proxy's TLS client certificate (not its key)
  proxyCert: {secretName: "", key: tls.crt} # optional pin: the proxy's client certificate itself (wins over proxyCA)
  proxyFrom: []                  # [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: iam-edge}}, podSelector: {matchLabels: {app: keycloak-edge-proxy}}}]

service:
  type: LoadBalancer             # CAC needs TLS to reach Keycloak intact: L4/TCP passthrough (NLB, MetalLB, ...)
  port: 443
  annotations: {}
extraEnv: []                     # e.g. [{name: HTTPS_PROXY, value: http://proxy:3128}]
resources:                       # measured: ~4.9 GiB with all 17 DoD CRLs loaded (~140 MB on disk), ~0.6 GiB without
  requests: {cpu: "1", memory: 6Gi}
  limits: {memory: 8Gi}          # file mode with only your users' issuing-CA CRLs needs far less
dataSizeLimit: 1Gi
podDisruptionBudget: {minAvailable: 1}
networkPolicy: {enabled: true}
# OpenShift (restricted-v2 SCC assigns its own UID): set podSecurityContext to {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
# No root group: the image's files are owned by UID 1000, and fsGroup 1000 makes the data volume and the 0440 secret
# files readable to the pod without group 0.
podSecurityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
nodeSelector: {}
tolerations: []
affinity: {}

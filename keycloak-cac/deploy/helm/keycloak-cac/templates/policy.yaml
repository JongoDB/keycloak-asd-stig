{{- if .Values.podDisruptionBudget }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kcc.name" . }}
  labels: {{- include "kcc.labels" . | nindent 4 }}
spec:
  {{- toYaml .Values.podDisruptionBudget | nindent 2 }}
  selector:
    matchLabels: {{- include "kcc.selector" . | nindent 6 }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kcc.name" . }}
  labels: {{- include "kcc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "kcc.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
  - ports: [{port: 8443}]                       # browsers and relying apps
  - from:
    - podSelector:
        matchLabels: {{- include "kcc.selector" . | nindent 10 }}
    ports: [{port: 7800}, {port: 9000}]         # cluster traffic between replicas, probes
{{- end }}

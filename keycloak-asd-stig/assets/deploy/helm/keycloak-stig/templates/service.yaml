apiVersion: v1
kind: Service
metadata:
  name: {{ include "kcs.name" . }}
  labels: {{- include "kcs.labels" . | nindent 4 }}
spec:
  type: {{ .Values.ingress.serviceType }}
  selector: {app.kubernetes.io/name: keycloak-stig, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports:
  - name: https
    port: 8443
    targetPort: https
    {{- if and .Values.ingress.nodePort (eq .Values.ingress.serviceType "NodePort") }}
    nodePort: {{ .Values.ingress.nodePort }}
    {{- end }}

{{- if eq .Values.ingress.mode "edge" }}
# Edge-verify with ingress-nginx: verify the CAC against the DoD anchors at the ingress and forward it.
# Keycloak re-validates the certificate and pins the DoD root DNs (x509.ca_subject_dns), so a misconfigured
# ingress cannot let a non-DoD certificate log in (tested with a deliberately broken proxy).
# The keycloak image must be built with --x509-lookup nginx.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kcs.name" . }}
  labels: {{- include "kcs.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/auth-tls-verify-client: optional
    nginx.ingress.kubernetes.io/auth-tls-secret: {{ required "ingress.edgeCaSecret is required for edge mode" .Values.ingress.edgeCaSecret | quote }}
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "4"
    nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "true"
    nginx.ingress.kubernetes.io/proxy-buffer-size: 128k
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-secret: {{ printf "%s/%s" .Release.Namespace .Values.tls.secretName | quote }}
    nginx.ingress.kubernetes.io/proxy-ssl-name: {{ include "kcs.name" . }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls: [{hosts: [{{ .Values.ingress.host | quote }}], secretName: {{ .Values.tls.secretName }}}]
  rules:
  - host: {{ .Values.ingress.host | quote }}
    http:
      paths:
      - {path: /, pathType: Prefix, backend: {service: {name: {{ include "kcs.name" . }}, port: {name: https}}}}
{{- end }}

# Edge-verify mode: the proxy terminates TLS, verifies the CAC against the DoD anchors, and forwards the
# certificate to Keycloak, which re-validates it (revocation, key usage, issuer pinning, UPN mapping).
# Use when the platform requires TLS termination at an ingress/load balancer. Same logic applies to
# ingress-nginx (annotations in references/cac-pki.md), HAProxy, Envoy and F5.
map $ssl_client_verify $stig_client_cert {
    SUCCESS  $ssl_client_escaped_cert;   # forward ONLY certificates nginx verified
    default  "";                         # FAILED/NONE: never forward (nginx still has the raw cert in optional mode)
}
server {
    listen 8443 ssl;
    server_name _;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_client_certificate /etc/nginx/pki/anchors.pem;   # DoD roots + intermediates only (V-222584)
    ssl_verify_client optional;                         # optional: password+MFA users have no card
    ssl_verify_depth 4;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass https://keycloak:8443;               # re-encrypt to Keycloak (V-222596)
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/tls/ca.crt;
        proxy_ssl_name keycloak;
        proxy_set_header ssl-client-cert $stig_client_cert;   # overwrites any client-supplied header
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffer_size 128k; proxy_buffers 4 256k; proxy_busy_buffers_size 256k;
    }
}
